<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>采销工作台 - 会议平板ToB运营</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#F0F1F5;--card:#FFFFFF;--text:#1B1F3B;--sub:#6B7280;--hint:#9CA3AF;--border:#E5E7EB;--accent:#534AB7;--danger:#DC2626;--warn:#D97706;--safe:#16A34A;--sidebar:250px;--topbar:56px}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);overflow:hidden;height:100vh}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--sidebar);background:#1B1F3B;color:#fff;display:flex;flex-direction:column;z-index:100;transition:transform .3s}
.sidebar-brand{padding:20px 20px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.08)}
.sidebar-brand .brand-icon{width:36px;height:36px;background:var(--accent);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px}
.sidebar-brand .brand-text{font-size:15px;font-weight:600;line-height:1.3}
.sidebar-brand .brand-sub{font-size:10px;color:rgba(255,255,255,.5);font-weight:400}
.sidebar-nav{flex:1;padding:12px 10px;overflow-y:auto}
.nav-label{font-size:10px;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:1px;padding:12px 12px 6px;font-weight:600}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:10px;cursor:pointer;transition:all .15s;font-size:14px;color:rgba(255,255,255,.65);margin-bottom:2px;position:relative}
.nav-item:hover{background:rgba(255,255,255,.06);color:rgba(255,255,255,.85)}
.nav-item.active{background:var(--accent);color:#fff;font-weight:600;box-shadow:0 2px 8px rgba(83,74,183,.4)}
.nav-item .nav-icon{width:20px;text-align:center;font-size:16px;flex-shrink:0}
.nav-item .nav-badge{position:absolute;right:10px;background:var(--danger);color:#fff;font-size:10px;padding:1px 7px;border-radius:8px;font-weight:600}
.sidebar-footer{padding:14px 20px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:rgba(255,255,255,.3)}
.main{margin-left:var(--sidebar);height:100vh;display:flex;flex-direction:column;transition:margin .3s}
.topbar{height:var(--topbar);background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:12px;flex-shrink:0;z-index:50}
.topbar .hamburger{display:none;width:36px;height:36px;align-items:center;justify-content:center;background:none;border:none;cursor:pointer;border-radius:8px;color:var(--text);font-size:20px}
.topbar .hamburger:hover{background:#F3F4F6}
.topbar-title{font-size:16px;font-weight:600;flex:1}
.topbar-desc{font-size:12px;color:var(--hint)}
.sync-btn{display:flex;align-items:center;gap:6px;padding:6px 14px;border-radius:20px;font-size:13px;font-weight:600;border:1.5px solid var(--border);background:#fff;color:var(--sub);cursor:pointer;transition:all .15s;flex-shrink:0}
.sync-btn:hover{border-color:var(--accent);color:var(--accent);background:#EEEDFE}
.content{flex:1;position:relative;overflow:hidden}
.content iframe{position:absolute;inset:0;width:100%;height:100%;border:none;background:var(--bg)}
.content iframe.hidden{display:none}
.home{padding:24px;overflow-y:auto;height:100%;background:var(--bg)}
.home-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:24px}
.home-card{background:#fff;border-radius:14px;padding:20px;cursor:pointer;transition:all .2s;border:1.5px solid transparent;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.home-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.1);transform:translateY(-2px);border-color:var(--accent)}
.home-card .hc-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:12px}
.home-card .hc-title{font-size:15px;font-weight:600;margin-bottom:4px}
.home-card .hc-desc{font-size:12px;color:var(--sub);line-height:1.5}
.home-card .hc-stats{display:flex;gap:12px;margin-top:12px;padding-top:10px;border-top:1px solid #F3F4F6}
.home-card .hc-stat{text-align:center;flex:1}
.home-card .hc-stat-num{font-size:18px;font-weight:700}
.home-card .hc-stat-label{font-size:10px;color:var(--hint)}
.home-welcome{margin-bottom:24px}
.home-welcome h1{font-size:24px;font-weight:700;margin-bottom:6px}
.home-welcome p{color:var(--sub);font-size:14px}
.quick-tip{background:linear-gradient(135deg,#534AB7,#7C3AED);color:#fff;border-radius:14px;padding:20px;margin-bottom:24px}
.quick-tip h3{font-size:15px;font-weight:600;margin-bottom:8px}
.quick-tip p{font-size:13px;opacity:.85;line-height:1.7}
/* Sync Modal */
.sync-mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px}
.sync-box{background:#fff;border-radius:16px;max-width:480px;width:100%;max-height:90vh;overflow-y:auto;padding:28px}
.sync-box h2{font-size:18px;font-weight:700;margin-bottom:4px}
.sf{margin-bottom:16px}.sf-label{font-size:13px;font-weight:600;color:var(--sub);margin-bottom:5px}
.sf-input{width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;font-family:monospace;outline:none;transition:border .2s}
.sf-input:focus{border-color:var(--accent)}
.sf-hint{font-size:11px;color:var(--hint);margin-top:4px;line-height:1.5}
.sync-actions{display:flex;gap:10px;margin-top:16px}
.sync-actions button{flex:1;padding:12px;border-radius:10px;font-size:14px;font-weight:600;border:none;cursor:pointer;transition:opacity .15s}
.sync-actions button:active{opacity:.8}
.sync-actions button:disabled{opacity:.5;pointer-events:none}
.sb-up{background:#EEEDFE;color:var(--accent)}.sb-down{background:#EFF6FF;color:#2563EB}.sb-cancel{background:#F3F4F6;color:var(--text)}
.sync-status{padding:10px 14px;border-radius:10px;font-size:13px;margin-top:14px;line-height:1.6;white-space:pre-line}
.sync-status.ok{background:#DCFCE7;color:#166534}.sync-status.err{background:#FEE2E2;color:#991B1B}.sync-status.info{background:#EFF6FF;color:#1E40AF}
.import-sep{margin-top:20px;padding-top:20px;border-top:1px solid var(--border)}
.import-btn{padding:10px 20px;border-radius:10px;font-size:13px;font-weight:600;border:1.5px dashed var(--border);background:#F9FAFB;color:var(--sub);cursor:pointer;width:100%;transition:all .15s;margin-top:10px}
.import-btn:hover{border-color:var(--accent);color:var(--accent);background:#EEEDFE}
/* Mobile */
@media(max-width:768px){
  .sidebar{transform:translateX(-100%);width:280px;box-shadow:4px 0 24px rgba(0,0,0,.3)}
  .sidebar.open{transform:translateX(0)}
  .sidebar-mask{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:99;display:none}
  .sidebar-mask.show{display:block}
  .main{margin-left:0}
  .topbar .hamburger{display:flex}
  .home-grid{grid-template-columns:1fr}
  .mob-tabs{display:flex!important}
}
@media(min-width:769px){.mob-tabs{display:none!important}}
.mob-tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);display:none;z-index:90;padding:4px 0 max(4px,env(safe-area-inset-bottom))}
.mob-tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 0;background:none;border:none;color:var(--hint);font-size:9px;cursor:pointer}
.mob-tab.active{color:var(--accent);font-weight:600}
.mob-tab .mt-icon{font-size:18px}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.2/babel.min.js"></script>
<script type="text/babel">
const {useState,useEffect,useCallback,useRef}=React;

const TOOLS=[
  {id:'home',icon:'🏠',label:'工作台',desc:'总览仪表盘',file:null},
  {id:'price',icon:'📡',label:'价格雷达',desc:'多平台价格监控与预警',file:'tool-price-radar.html',color:'#E4393C',bg:'#FEF2F2'},
  {id:'inv',icon:'📦',label:'库存水位',desc:'分仓库存预警与跨仓调拨',file:'tool-inventory.html',color:'#2563EB',bg:'#EFF6FF'},
  {id:'pdp',icon:'🔍',label:'商详巡检',desc:'商品详情页质量巡检',file:'tool-pdp.html',color:'#7C3AED',bg:'#F5F3FF'},
  {id:'complaint',icon:'🛡️',label:'客诉雷达',desc:'客户投诉追踪与SLA管理',file:'tool-complaint.html',color:'#D97706',bg:'#FFFBEB'},
  {id:'scenario',icon:'💼',label:'场景方案',desc:'ToB解决方案生成与报价',file:'tool-scenario.html',color:'#059669',bg:'#ECFDF5'},
  {id:'calendar',icon:'📅',label:'活动排期',desc:'促销日历与任务节点管理',file:'tool-calendar.html',color:'#E4393C',bg:'#FEF2F2'},
];

// ===== Cloud Sync =====
const SYNC_KEY='platform-sync-config';
const ALL_KEYS=['price-radar-v11','inv-alert-v17','pdp-check-v8','complaint-v10','scene-solution-skus','act-calendar-v1'];
function getSyncCfg(){try{return JSON.parse(localStorage.getItem(SYNC_KEY))||{};}catch{return{};}}
function setSyncCfg(c){localStorage.setItem(SYNC_KEY,JSON.stringify(c));}

async function doUpload(token,gistId){
  const data={};ALL_KEYS.forEach(k=>{const v=localStorage.getItem(k);if(v)data[k]=v;});
  data._syncTime=new Date().toISOString();
  const resp=await fetch(`https://api.github.com/gists/${gistId}`,{method:'PATCH',headers:{'Authorization':`token ${token}`,'Content-Type':'application/json'},body:JSON.stringify({files:{'platform-data.json':{content:JSON.stringify(data,null,2)}}})});
  if(!resp.ok)throw new Error('上传失败('+resp.status+')');
}
async function doDownload(token,gistId){
  const resp=await fetch(`https://api.github.com/gists/${gistId}`,{headers:{'Authorization':`token ${token}`}});
  if(!resp.ok)throw new Error('下载失败('+resp.status+')');
  const gist=await resp.json();const f=gist.files['platform-data.json'];if(!f)throw new Error('云端暂无数据');
  const data=JSON.parse(f.content);let n=0;ALL_KEYS.forEach(k=>{if(data[k]){localStorage.setItem(k,data[k]);n++;}});
  const cf=gist.files['crawler-results.json'];
  if(cf){try{localStorage.setItem('_crawler_latest',cf.content);}catch{}}
  return{restored:n,hasCrawler:!!cf,syncTime:data._syncTime};
}
async function doCreateGist(token){
  const resp=await fetch('https://api.github.com/gists',{method:'POST',headers:{'Authorization':`token ${token}`,'Content-Type':'application/json'},body:JSON.stringify({description:'采销工作台云同步',public:false,files:{'platform-data.json':{content:'{}'}}})});
  if(!resp.ok)throw new Error('创建失败('+resp.status+')');
  return(await resp.json()).id;
}

function SyncModal({onClose}){
  const cfg=getSyncCfg();
  const [token,setToken]=useState(cfg.token||'');
  const [gistId,setGistId]=useState(cfg.gistId||'');
  const [status,setStatus]=useState(null);
  const [busy,setBusy]=useState(false);
  const fileRef=useRef(null);
  const save=(t,g)=>{setSyncCfg({token:t||token,gistId:g||gistId,lastSync:cfg.lastSync});};

  const upload=async()=>{if(!token||!gistId)return setStatus({t:'err',m:'请先填写Token和Gist ID'});
    setBusy(true);setStatus({t:'info',m:'正在上传…'});
    try{await doUpload(token,gistId);save();setSyncCfg({token,gistId,lastSync:new Date().toISOString()});
      setStatus({t:'ok',m:'上传成功！6个模块数据已同步。\n时间：'+new Date().toLocaleString()});}
    catch(e){setStatus({t:'err',m:e.message});}setBusy(false);};

  const download=async()=>{if(!token||!gistId)return setStatus({t:'err',m:'请先填写Token和Gist ID'});
    setBusy(true);setStatus({t:'info',m:'正在下载…'});
    try{const r=await doDownload(token,gistId);save();setSyncCfg({token,gistId,lastSync:new Date().toISOString()});
      let msg='下载成功！恢复了'+r.restored+'个模块。';
      if(r.hasCrawler)msg+='\n发现爬虫数据，可在价格雷达中导入。';
      msg+='\n⚠️ 请刷新页面使数据生效';
      setStatus({t:'ok',m:msg});}
    catch(e){setStatus({t:'err',m:e.message});}setBusy(false);};

  const create=async()=>{if(!token)return setStatus({t:'err',m:'请先填写Token'});
    setBusy(true);setStatus({t:'info',m:'正在创建…'});
    try{const id=await doCreateGist(token);setGistId(id);save(token,id);setSyncCfg({token,gistId:id});
      setStatus({t:'ok',m:'Gist创建成功！\nID: '+id+'\n已自动填入，点「上传」同步数据'});}
    catch(e){setStatus({t:'err',m:e.message});}setBusy(false);};

  const importFile=(e)=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
    r.onload=(ev)=>{try{const d=JSON.parse(ev.target.result);if(!d.results?.length)return setStatus({t:'err',m:'文件格式不对'});
      localStorage.setItem('_crawler_latest',ev.target.result);
      setStatus({t:'ok',m:'导入成功！'+d.results.length+'条价格。\n打开价格雷达 → 点「📥 导入爬虫」使用'});}
    catch(err){setStatus({t:'err',m:'解析失败: '+err.message});}};r.readAsText(f);e.target.value='';};

  return(<div className="sync-mask" onClick={onClose}><div className="sync-box" onClick={e=>e.stopPropagation()}>
    <h2>☁️ 云同步设置</h2>
    <div style={{fontSize:13,color:'var(--sub)',marginBottom:20,lineHeight:1.6}}>通过GitHub Gist免费同步数据，实现电脑/手机多设备共享。数据仅自己可见。</div>

    <div className="sf"><div className="sf-label">GitHub Token</div>
      <input className="sf-input" type="password" value={token} onChange={e=>setToken(e.target.value)} placeholder="ghp_xxxxxxxxxxxxxxxxxxxx"/>
      <div className="sf-hint">GitHub → Settings → Developer settings → Personal access tokens (classic) → 勾选「gist」</div>
    </div>
    <div className="sf"><div className="sf-label">Gist ID</div>
      <div style={{display:'flex',gap:8}}>
        <input className="sf-input" type="text" value={gistId} onChange={e=>setGistId(e.target.value)} placeholder="a1b2c3d4e5f6..." style={{flex:1}}/>
        <button onClick={create} disabled={busy||!token} style={{padding:'8px 14px',borderRadius:10,fontSize:12,fontWeight:600,border:'1.5px solid var(--accent)',background:'#EEEDFE',color:'var(--accent)',cursor:'pointer',whiteSpace:'nowrap',flexShrink:0}}>自动创建</button>
      </div>
      <div className="sf-hint">首次使用？填Token后点「自动创建」。已有Gist填ID即可。</div>
    </div>

    {cfg.lastSync&&<div style={{fontSize:12,color:'var(--hint)',marginBottom:6}}>上次同步：{new Date(cfg.lastSync).toLocaleString()}</div>}

    <div className="sync-actions">
      <button className="sb-up" onClick={upload} disabled={busy}>⬆️ 上传</button>
      <button className="sb-down" onClick={download} disabled={busy}>⬇️ 下载</button>
      <button className="sb-cancel" onClick={onClose}>关闭</button>
    </div>

    {status&&<div className={`sync-status ${status.t}`}>{status.m}</div>}

    <div className="import-sep">
      <div style={{fontSize:14,fontWeight:600,marginBottom:4}}>📥 导入爬虫数据</div>
      <div style={{fontSize:12,color:'var(--hint)',lineHeight:1.5}}>将Python爬虫生成的 crawler_results.json 导入</div>
      <input type="file" accept=".json" ref={fileRef} style={{display:'none'}} onChange={importFile}/>
      <button className="import-btn" onClick={()=>fileRef.current?.click()}>选择 crawler_results.json</button>
    </div>
  </div></div>);
}

// ===== Stats =====
function getStats(){
  const s={price:{},inv:{},pdp:{},complaint:{},scenario:{},calendar:{}};
  try{const pr=JSON.parse(localStorage.getItem('price-radar-v11')||'null');
    if(pr?.dates?.length){const d=pr.dates.find(x=>x.id===pr.currentDate);s.price.dates=pr.dates.length;s.price.skus=d?.groups?.length||0;
      let alerts=0;d?.groups?.forEach(g=>{if(!g.alertOn)return;const jd=g.items?.find(i=>i.isBench);if(!jd)return;const jdP=Math.min(...(jd.priceEntries||[]).map(e=>Math.max(0,e.price-(e.discount||0))).filter(x=>x>0));g.items?.filter(i=>!i.isBench).forEach(i=>{const bp=Math.min(...(i.priceEntries||[]).map(e=>Math.max(0,e.price-(e.discount||0))).filter(x=>x>0));if(bp<jdP)alerts++;});});s.price.alerts=alerts;}}catch{}
  try{const iv=JSON.parse(localStorage.getItem('inv-alert-v17')||'null');
    if(iv?.dates?.length){const d=iv.dates.find(x=>x.id===iv.currentDate);const skus=d?.skus||[];s.inv.skus=skus.length;let danger=0,warn=0;
      skus.forEach(sk=>{let worst='safe';sk.warehouses?.forEach(w=>{const ed=w.dailySales;const safe=ed*(w.leadTime+w.buffer);const av=w.stock-(w.allocated||0);if(av<=0||av<safe*.5)worst='danger';else if(av<safe&&worst==='safe')worst='warn';});if(worst==='danger')danger++;else if(worst==='warn')warn++;});s.inv.danger=danger;s.inv.warn=warn;}}catch{}
  try{const cp=JSON.parse(localStorage.getItem('complaint-v10')||'null');
    if(cp?.complaints){s.complaint.total=cp.complaints.length;s.complaint.open=cp.complaints.filter(c=>c.status==='pending'||c.status==='processing').length;}}catch{}
  try{const pd=JSON.parse(localStorage.getItem('pdp-check-v8')||'null');
    if(pd?.skus){s.pdp.skus=pd.skus.length;let issues=0;pd.skus.forEach(sk=>{(sk.records||[]).forEach(r=>{(r.issues||[]).forEach(is=>{if(!is.resolved)issues++;});});});s.pdp.issues=issues;}}catch{}
  try{const sc=JSON.parse(localStorage.getItem('scene-solution-skus')||'null');if(sc)s.scenario.skus=sc.length;}catch{}
  try{const cal=JSON.parse(localStorage.getItem('act-calendar-v1')||'null');
    if(cal?.acts){s.calendar={total:cal.acts.length,urgent:0};const td=new Date().toISOString().slice(0,10);
      cal.acts.forEach(a=>{(a.tasks||[]).filter(t=>!t.done&&t.dueDate).forEach(t=>{const d=Math.ceil((new Date(t.dueDate)-new Date(td))/864e5);if(d>=0&&d<=3)s.calendar.urgent++;});});}}catch{}
  return s;
}

function App(){
  const [active,setActive]=useState('home');
  const [sideOpen,setSideOpen]=useState(false);
  const [stats,setStats]=useState(getStats);
  const [loaded,setLoaded]=useState({});
  const [showSync,setShowSync]=useState(false);

  useEffect(()=>{if(active==='home')setStats(getStats());},[active]);
  const go=useCallback((id)=>{setActive(id);setSideOpen(false);if(id!=='home')setLoaded(p=>({...p,[id]:true}));},[]);
  const tool=TOOLS.find(t=>t.id===active);
  const hour=new Date().getHours();
  const greeting=hour<6?'夜深了':hour<9?'早上好':hour<12?'上午好':hour<14?'中午好':hour<18?'下午好':'晚上好';
  const tips=['每天早晨先检查价格雷达的预警，再看库存水位的紧急SKU，最后处理客诉工单。','补货周期 = 品牌方从接到你的需求到货物入京东仓的天数，不同品牌不一样，多问多记。','商详页巡检建议每周做一次，大促前加做一次突击检查。','遇到竞品降价先标注性质（临时促销/长期调价），不同性质应对策略完全不同。','大客户订单（10台+）务必提前和销售团队建立沟通机制，别等下单了才知道。','库存水位的日均销量用近7天均值，别只看昨天——ToB单日波动非常大。'];
  const todayTip=tips[new Date().getDate()%tips.length];
  const hasCfg=!!(getSyncCfg().token&&getSyncCfg().gistId);

  return(<>
    <div className={`sidebar ${sideOpen?'open':''}`}>
      <div className="sidebar-brand"><div className="brand-icon">🎯</div><div><div className="brand-text">采销工作台</div><div className="brand-sub">会议平板ToB · 3C数码</div></div></div>
      <div className="sidebar-nav">
        <div className="nav-label">导航</div>
        {TOOLS.map(t=>{
          const badge=t.id==='price'&&stats.price.alerts>0?stats.price.alerts:t.id==='inv'&&stats.inv.danger>0?stats.inv.danger:t.id==='complaint'&&stats.complaint.open>0?stats.complaint.open:t.id==='calendar'&&stats.calendar?.urgent>0?stats.calendar.urgent:null;
          return<div key={t.id} className={`nav-item ${active===t.id?'active':''}`} onClick={()=>go(t.id)}><span className="nav-icon">{t.icon}</span>{t.label}{badge>0&&<span className="nav-badge">{badge}</span>}</div>;
        })}
        <div className="nav-label" style={{marginTop:12}}>设置</div>
        <div className="nav-item" onClick={()=>setShowSync(true)}><span className="nav-icon">☁️</span>云同步{hasCfg&&<span style={{position:'absolute',right:10,width:8,height:8,borderRadius:'50%',background:'var(--safe)'}}/>}</div>
      </div>
      <div className="sidebar-footer">京东采销运营工具 v1.1</div>
    </div>
    {sideOpen&&<div className="sidebar-mask show" onClick={()=>setSideOpen(false)}/>}

    <div className="main">
      <div className="topbar">
        <button className="hamburger" onClick={()=>setSideOpen(true)}>☰</button>
        <div className="topbar-title">{tool?.icon} {tool?.label||'工作台'}</div>
        <div className="topbar-desc">{tool?.desc}</div>
        <button className="sync-btn" onClick={()=>setShowSync(true)}>☁️{hasCfg?' 已配置':' 同步'}</button>
      </div>
      <div className="content">
        {active==='home'&&<div className="home">
          <div className="home-welcome"><h1>{greeting}，采销大人 👋</h1><p>今天也要元气满满地盯数据！</p></div>
          <div className="quick-tip"><h3>💡 今日提醒</h3><p>{todayTip}</p></div>
          <div style={{fontSize:14,fontWeight:600,marginBottom:12,color:'var(--sub)'}}>📊 各模块概览（点击进入）</div>
          <div className="home-grid">
            {[['price','📡','价格雷达','多平台价格监控，竞品降价预警','#FEF2F2','#E4393C',[['监控中',stats.price.skus],['预警',stats.price.alerts,stats.price.alerts>0?'var(--danger)':'var(--safe)'],['日期页',stats.price.dates]]],
              ['inv','📦','库存水位','分仓预警，跨仓调拨，大促备货','#EFF6FF','#2563EB',[['SKU',stats.inv.skus],['紧急',stats.inv.danger,'var(--danger)'],['偏低',stats.inv.warn,'var(--warn)']]],
              ['pdp','🔍','商详巡检','商品详情页质量检查与问题追踪','#F5F3FF','#7C3AED',[['SKU',stats.pdp.skus],['待修问题',stats.pdp.issues,stats.pdp.issues>0?'var(--warn)':'var(--safe)']]],
              ['complaint','🛡️','客诉雷达','客户投诉处理与SLA监控','#FFFBEB','#D97706',[['总工单',stats.complaint.total],['待处理',stats.complaint.open,stats.complaint.open>0?'var(--danger)':'var(--safe)']]],
              ['scenario','💼','场景方案','ToB解决方案配置与报价生成','#ECFDF5','#059669',[['SKU库',stats.scenario.skus]]],
              ['calendar','📅','活动排期','促销日历、任务节点、活动复盘','#FEF2F2','#E4393C',[['活动',stats.calendar?.total],['即将截止',stats.calendar?.urgent,stats.calendar?.urgent>0?'var(--danger)':'var(--safe)']]]
            ].map(([id,icon,title,desc,bg,color,st])=>(
              <div key={id} className="home-card" onClick={()=>go(id)}>
                <div className="hc-icon" style={{background:bg,color}}>{icon}</div>
                <div className="hc-title">{title}</div><div className="hc-desc">{desc}</div>
                <div className="hc-stats">{st.map(([label,val,c])=><div key={label} className="hc-stat"><div className="hc-stat-num" style={c?{color:c}:{}}>{val||0}</div><div className="hc-stat-label">{label}</div></div>)}</div>
              </div>
            ))}
          </div>
          <div style={{background:'#fff',borderRadius:14,padding:20,marginTop:8,boxShadow:'0 1px 4px rgba(0,0,0,.05)'}}>
            <div style={{fontSize:14,fontWeight:600,marginBottom:10}}>📅 每日工作流（建议）</div>
            <div style={{fontSize:13,color:'var(--sub)',lineHeight:2}}>
              <div>1️⃣ <b>08:30</b> — 打开<span style={{color:'#E4393C',cursor:'pointer'}} onClick={()=>go('price')}>「价格雷达」</span>创建今日日期页，录入各平台价格</div>
              <div>2️⃣ <b>09:00</b> — 打开<span style={{color:'#2563EB',cursor:'pointer'}} onClick={()=>go('inv')}>「库存水位」</span>创建今日日期页，更新各仓库存</div>
              <div>3️⃣ <b>09:30</b> — 处理<span style={{color:'#D97706',cursor:'pointer'}} onClick={()=>go('complaint')}>「客诉雷达」</span>中超时和新增工单</div>
              <div>4️⃣ <b>10:00</b> — 按预警结果联系品牌方补货/调价</div>
              <div>5️⃣ <b>每周一</b> — 做一次<span style={{color:'#7C3AED',cursor:'pointer'}} onClick={()=>go('pdp')}>「商详巡检」</span></div>
              <div>6️⃣ <b>有客户需求时</b> — 用<span style={{color:'#059669',cursor:'pointer'}} onClick={()=>go('scenario')}>「场景方案」</span>快速生成报价</div>
              <div>📅 <b>每周一</b> — 打开<span style={{color:'#E4393C',cursor:'pointer'}} onClick={()=>go('calendar')}>「活动排期」</span>检查本周有无deadline</div>
            </div>
          </div>
        </div>}
        {TOOLS.filter(t=>t.file).map(t=>(loaded[t.id]||active===t.id)&&<iframe key={t.id} src={t.file} className={active===t.id?'':'hidden'} onLoad={()=>setLoaded(p=>({...p,[t.id]:true}))}/>)}
      </div>
    </div>
    {showSync&&<SyncModal onClose={()=>{setShowSync(false);if(active==='home')setStats(getStats());}}/>}
  </>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
